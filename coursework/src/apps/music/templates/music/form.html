{% extends 'music/base.html' %}

{% block content %}
    <div class="col-md-9 col-lg-7">
        <h1 class="h2 mb-3">{{ title }}</h1>
        {% if help_text %}
            <p class="text-body-secondary">{{ help_text }}</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            {% include 'music/fields.html' %}
            <button class="btn btn-primary" type="submit">Сохранить</button>
            <a class="btn btn-outline-secondary" href="{{ list_url }}">К списку</a>
        </form>
    </div>
{% endblock %}
