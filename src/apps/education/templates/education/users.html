{% extends 'education/base.html' %}
{% block content %}
<h1 class="h2 mb-3">{{ title }}</h1>
<div class="table-responsive">
    <table class="table table-bordered table-striped align-middle caption-top">
        <caption>Всего пользователей: {{ users|length }}</caption>
        <thead class="table-light">
            <tr><th scope="col">Имя</th><th scope="col">Фамилия</th><th scope="col">Email</th></tr>
        </thead>
        <tbody>
        {% for account in users %}
            <tr><td>{{ account.first_name }}</td><td>{{ account.last_name }}</td><td>{{ account.email }}</td></tr>
        {% empty %}
            <tr><td colspan="3" class="text-center text-body-secondary">Пользователей пока нет.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
