<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} — Учебные справочники</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body>
<nav class="navbar bg-body-tertiary border-bottom" aria-label="Основная навигация">
    <div class="container gap-3">
        <span class="navbar-brand mb-0">Учебные справочники</span>
        <div class="nav nav-pills">
            <a class="nav-link{% if kind == 'students' %} active{% endif %}"
               href="{% url 'education:web-student-list' %}"
               {% if kind == 'students' %}aria-current="page"{% endif %}>Студенты</a>
            <a class="nav-link{% if kind == 'groups' %} active{% endif %}"
               href="{% url 'education:web-group-list' %}"
               {% if kind == 'groups' %}aria-current="page"{% endif %}>Учебные группы</a>
        </div>
    </div>
</nav>
<main class="container py-4">
    {% for message in messages %}
        <div class="alert alert-success" role="status">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
